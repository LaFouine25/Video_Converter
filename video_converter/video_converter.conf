{
    // Liste des répertoires à scanner récursivement pour les fichiers vidéo
    // Utilisez des chemins absolus ou relatifs
    "directories": [
        "/chemin/vers/vos/videos",
        "/autre/chemin/avec/videos"
    ],
    
    // Taille minimale des fichiers à traiter (en Mo)
    // Les fichiers plus petits seront ignorés
    "min_size_mb": 10,
    
    // Taille maximale des fichiers à traiter (en Go)
    // Les fichiers plus grands seront ignorés
    "max_size_gb": 50,
    
    // Activer/désactiver la création de backups
    // Si true: crée un backup du fichier original avant conversion (fichier.backup_YYYYMMDD_HHMMSS)
    // Si false: supprime directement le fichier original après conversion réussie
    "keep_backup": true,
    
    // Paramètres FFmpeg pour la conversion HEVC
    // Ces paramètres peuvent être ajustés selon vos besoins
    "ffmpeg_params": {
        "preset": "p7",
        "tune": "hq",
        "qp": 23,
        "profile": "main10"
    }
}
